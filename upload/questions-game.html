<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الأسئلة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f6fd;--surface:#fff;--surface2:#e4edfc;--text:#0b0f1a;--muted:#5b6478;--line:#d6e1f5;
  --accent:#1a56db;--accent2:#38a1ff;--accent-text:#fff;--danger:#4b5568;--shadow:0 10px 30px rgba(26,86,219,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05070d;--surface:#0e1320;--surface2:#18202f;--text:#f4f7ff;--muted:#93a0b8;--line:#232d42;
  --accent:#3b82f6;--accent2:#60c0ff;--shadow:0 10px 30px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --bg:#05070d;--surface:#0e1320;--surface2:#18202f;--text:#f4f7ff;--muted:#93a0b8;--line:#232d42;
  --accent:#3b82f6;--accent2:#60c0ff;--shadow:0 10px 30px rgba(0,0,0,.5);}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.logo{font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;cursor:pointer;font-size:1.1rem}
.screen{display:none;flex:1;flex-direction:column;gap:14px;animation:fade .3s ease}
.screen.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:16px;padding:4px;gap:4px}
.tab{border:0;background:transparent;padding:12px;border-radius:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:.2s}
.tab.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.tab b{background:var(--accent);color:var(--accent-text);border-radius:99px;padding:1px 8px;font-size:.8rem;margin-inline-start:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}
.add input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-text);transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface2);color:var(--text)}
.hint{font-size:.85rem;color:var(--muted);margin:8px 2px 0}
.list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto}
.list li{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px;animation:fade .25s ease}
.list .n{width:26px;height:26px;border-radius:8px;background:var(--surface2);color:var(--accent);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.list .t{flex:1;word-break:break-word}
.list .x{background:none;border:0;color:var(--danger);font-size:1.1rem;cursor:pointer;padding:4px 8px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.opt{display:flex;align-items:center;gap:10px;font-size:.95rem;cursor:pointer}
.opt input{accent-color:var(--accent);width:18px;height:18px}
.footer{position:sticky;bottom:0;padding:12px 0 8px;background:linear-gradient(transparent,var(--bg) 30%);margin-top:auto}
.footer .btn{width:100%;padding:16px;font-size:1.1rem;background:linear-gradient(135deg,var(--accent),var(--accent2))}
/* game */
.progress{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.3s}
.dot.done{background:var(--accent2)}.dot.cur{background:var(--accent);transform:scale(1.5)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.turn{text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:2.2rem;font-weight:800;color:#fff;box-shadow:var(--shadow)}
.turn small{color:var(--muted);display:block}
.turn h2{margin:2px 0 0;font-size:2rem;font-weight:800;word-break:break-word}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:30px 22px;min-height:190px;display:grid;place-items:center;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.qtext{font-size:1.6rem;font-weight:700;line-height:1.6;word-break:break-word}
.pop{animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-2deg)}to{opacity:1;transform:none}}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px}
.actions .btn{padding:16px;font-size:1.15rem}
.actions .next{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.actions .btn.ghost{font-size:1rem;padding:16px 18px}
.end{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span>🎲</span> لعبة الأسئلة</div>
    <button class="icon-btn" id="theme" aria-label="تغيير المظهر">🌓</button>
  </header>

  <!-- Setup -->
  <section class="screen active" id="setup">
    <div class="tabs">
      <button class="tab on" data-tab="q">الأسئلة<b id="qc">0</b></button>
      <button class="tab" data-tab="p">اللاعبون<b id="pc">0</b></button>
    </div>
    <div class="card" id="pane-q">
      <div class="add"><input id="qin" placeholder="اكتب سؤالاً ثم اضغط إضافة" maxlength="200"><button class="btn" id="qadd">إضافة</button></div>
      <p class="hint">تقدر تلصق عدة أسئلة دفعة واحدة، كل سؤال في سطر.</p>
      <ul class="list" id="qlist"></ul>
    </div>
    <div class="card" id="pane-p" hidden>
      <div class="add"><input id="pin" placeholder="اكتب اسم اللاعب" maxlength="30"><button class="btn" id="padd">إضافة</button></div>
      <p class="hint">تقدر تضيف عدة أسماء مفصولة بسطر أو فاصلة.</p>
      <ul class="list" id="plist"></ul>
    </div>
    <div class="card opts">
      <label class="opt"><input type="checkbox" id="o-norepeat" checked> عدم تكرار السؤال حتى تنتهي كل الأسئلة</label>
      <label class="opt"><input type="checkbox" id="o-shuffle"> ترتيب اللاعبين عشوائي عند البدء</label>
    </div>
    <div class="footer"><button class="btn" id="start" disabled>ابدأ اللعبة 🚀</button></div>
  </section>

  <!-- Game -->
  <section class="screen" id="game">
    <div class="progress"><span id="round">الجولة 1</span><span id="turnno"></span></div>
    <div class="dots" id="dots"></div>
    <div class="stage">
      <div class="turn"><div class="avatar" id="av"></div><small>الدور على</small><h2 id="pname"></h2></div>
      <div class="qcard"><div class="qtext" id="qtext"></div></div>
    </div>
    <div class="actions">
      <button class="btn next" id="next">التالي ←</button>
      <button class="btn ghost" id="reroll" title="سؤال آخر">🔄</button>
    </div>
    <button class="end" id="end">إنهاء اللعبة والعودة للإعدادات</button>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let questions=store.get('qg-q',[]), players=store.get('qg-p',[]);
let opts=store.get('qg-o',{norepeat:true,shuffle:false});
let order=[], idx=0, round=1, bag=[], current='';
const colors=['#1a56db','#2563eb','#1e3a8a','#0369a1','#3b82f6','#334155','#0ea5e9','#1d4ed8'];

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2000)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){store.set('qg-q',questions);store.set('qg-p',players);store.set('qg-o',opts)}

function renderList(el,arr,kind,emptyMsg){
  el.innerHTML='';
  if(!arr.length){el.innerHTML='<li class="empty">'+emptyMsg+'</li>';return}
  arr.forEach((txt,i)=>{
    const li=document.createElement('li');
    li.innerHTML='<span class="n">'+(i+1)+'</span><span class="t"></span><button class="x" aria-label="حذف">✕</button>';
    li.querySelector('.t').textContent=txt;
    li.querySelector('.x').onclick=()=>{arr.splice(i,1);refresh()};
    el.appendChild(li);
  });
}
function refresh(){
  renderList($('#qlist'),questions,'q','لا توجد أسئلة بعد، أضف أول سؤال 👆');
  renderList($('#plist'),players,'p','لا يوجد لاعبون بعد، أضف أول اسم 👆');
  $('#qc').textContent=questions.length;$('#pc').textContent=players.length;
  $('#start').disabled=!(questions.length&&players.length);
  $('#o-norepeat').checked=opts.norepeat;$('#o-shuffle').checked=opts.shuffle;
  save();
}
function addItems(inputEl,arr,max){
  const parts=inputEl.value.split(/[\n،,]+/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length)return;
  let added=0,dup=0;
  parts.forEach(p=>{if(arr.includes(p))dup++;else{arr.push(p);added++}});
  inputEl.value='';inputEl.focus();refresh();
  if(dup)toast(dup+' مكرر تم تجاهله');
}
$('#qadd').onclick=()=>addItems($('#qin'),questions);
$('#padd').onclick=()=>addItems($('#pin'),players);
$('#qin').addEventListener('keydown',e=>{if(e.key==='Enter')addItems($('#qin'),questions)});
$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')addItems($('#pin'),players)});
$('#o-norepeat').onchange=e=>{opts.norepeat=e.target.checked;save()};
$('#o-shuffle').onchange=e=>{opts.shuffle=e.target.checked;save()};

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  $('#pane-q').hidden=b.dataset.tab!=='q';$('#pane-p').hidden=b.dataset.tab!=='p';
  (b.dataset.tab==='q'?$('#qin'):$('#pin')).focus();
});

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));window.scrollTo(0,0)}

function pickQuestion(){
  if(opts.norepeat){
    if(!bag.length){
      bag=shuffle(questions);
      if(bag.length>1&&bag[bag.length-1]===current)bag.unshift(bag.pop());
      if(round>1||idx>0)toast('انتهت الأسئلة، نعيد خلطها 🔀');
    }
    current=bag.pop();
  }else{
    let q;do{q=questions[Math.floor(Math.random()*questions.length)]}while(questions.length>1&&q===current);
    current=q;
  }
  const el=$('#qtext');el.textContent=current;
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
}
function renderTurn(){
  const name=order[idx],card=$('#av');
  const ci=players.indexOf(name);
  card.style.background=colors[(ci<0?idx:ci)%colors.length];
  card.textContent=[...name][0];
  $('#pname').textContent=name;
  $('#round').textContent='الجولة '+round;
  $('#turnno').textContent='اللاعب '+(idx+1)+' من '+order.length;
  $('#dots').innerHTML=order.map((_,i)=>'<span class="dot '+(i<idx?'done':i===idx?'cur':'')+'"></span>').join('');
  const h=$('#pname');h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop');
  $('#next').textContent=(idx===order.length-1)?'جولة جديدة ↻':'التالي ←';
}
function startGame(){
  order=opts.shuffle?shuffle(players):players.slice();
  idx=0;round=1;bag=[];current='';
  show('game');renderTurn();pickQuestion();
}
$('#start').onclick=startGame;
$('#next').onclick=()=>{
  idx++;
  if(idx>=order.length){idx=0;round++;if(opts.shuffle)order=shuffle(order)}
  renderTurn();pickQuestion();
};
$('#reroll').onclick=()=>{if(questions.length<2){toast('لا يوجد سؤال آخر');return}pickQuestion()};
$('#end').onclick=()=>{if(confirm('تنهي اللعبة وترجع للإعدادات؟')){show('setup')}};

/* theme */
$('#theme').onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark';
};
refresh();
</script>
</body>
</html>
